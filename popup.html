<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopee Affiliate Link</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    html {
      width: max-content;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #1f2933;
      overflow: hidden;
    }

    .popup-shell {
      width: 460px;
      padding: 16px;
      background: #ffffff;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #c8d0d8;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
    }

    input {
      height: 38px;
      margin-bottom: 12px;
    }

    textarea {
      min-height: 96px;
      margin-bottom: 12px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px 12px;
      border: 0;
      border-radius: 6px;
      background: #ee4d2d;
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .secondary-button {
      width: auto;
      margin-top: 0;
      padding: 7px 10px;
      border: 1px solid #c8d0d8;
      background: #ffffff;
      color: #1f2933;
      font-size: 12px;
      font-weight: 700;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .switch-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      position: relative;
      flex: 0 0 auto;
      width: 46px;
      height: 28px;
      border-radius: 999px;
      background: #c8d0d8;
      cursor: pointer;
      transition: background 160ms ease;
    }

    .switch-row input:focus-visible ~ .switch-track {
      outline: 2px solid #4c9ffe;
      outline-offset: 2px;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.25);
      transition: transform 160ms ease;
    }

    .switch-row input:checked ~ .switch-track {
      background: #34c759;
    }

    .switch-row input:checked ~ .switch-track::after {
      transform: translateX(18px);
    }

    output {
      display: block;
      margin-top: 12px;
      padding: 10px;
      min-height: 18px;
      border-radius: 6px;
      background: #f4f6f8;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    output[data-state="error"] {
      background: #fff1f0;
      color: #b42318;
    }

    output[data-state="success"] {
      background: #eefaf1;
      color: #17663a;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-item {
      padding: 10px;
      border: 1px solid #d9e0e7;
      border-radius: 6px;
      background: #f8fafc;
    }

    .stat-label {
      display: block;
      margin-bottom: 4px;
      color: #52616f;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }

    .failed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .failed-title {
      margin: 0;
      font-size: 13px;
    }

    .failed-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
    }

    .failed-empty,
    .failed-item {
      padding: 10px;
      border: 1px solid #d9e0e7;
      border-radius: 6px;
      background: #ffffff;
      font-size: 12px;
    }

    .failed-url,
    .failed-error {
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    .failed-error {
      margin-top: 6px;
      color: #b42318;
    }

    .failed-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    #modeStatus,
    #linkCheckStatus {
      margin-top: 0;
      margin-bottom: 12px;
      min-height: auto;
      font-weight: 700;
    }

    #modeStatus[data-state="dev"] {
      background: #fff1f0;
      color: #b42318;
    }

    #modeStatus[data-state="live"] {
      background: #eefaf1;
      color: #17663a;
    }

    #linkCheckStatus[data-state="enabled"] {
      background: #eefaf1;
      color: #17663a;
    }

    #linkCheckStatus[data-state="disabled"] {
      background: #f4f6f8;
      color: #52616f;
    }

    #mqttStatus {
      margin-top: 0;
      margin-bottom: 12px;
      min-height: auto;
      font-size: 12px;
    }

    #mqttStatus[data-state="connected"] {
      background: #eefaf1;
      color: #17663a;
    }

    #mqttStatus[data-state="offline"] {
      background: #fff8e6;
      color: #8a5a00;
    }
  </style>
</head>
<body>
<main class="popup-shell">
  <label for="url"><a href="https://affiliate.shopee.vn/offer/custom_link" target="_blank">Shopee URL</a></label>
  <textarea id="url" placeholder="https://shopee.vn/..."></textarea>
  <label for="subId1">Sub ID 1</label>
  <input id="subId1" type="text" placeholder="SUB ID 1">
  <label class="switch-row" for="testMode">
    <input id="testMode" type="checkbox">
    <span>Dev mode</span>
    <span class="switch-track" aria-hidden="true"></span>
  </label>
  <output id="modeStatus" aria-live="polite"></output>
  <label class="switch-row" for="linkCheckMode">
    <input id="linkCheckMode" type="checkbox">
    <span>Check current tab link</span>
    <span class="switch-track" aria-hidden="true"></span>
  </label>
  <output id="linkCheckStatus" aria-live="polite"></output>
  <output id="mqttStatus" aria-live="polite"></output>
  <section class="stats-grid" aria-label="Affiliate stats">
    <div class="stat-item">
      <span class="stat-label">Created</span>
      <span id="createdCount" class="stat-value">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Processing</span>
      <span id="inProgressCount" class="stat-value">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Failed</span>
      <span id="failedCount" class="stat-value">0</span>
    </div>
  </section>
  <button id="run" type="button">Generate</button>
  <output id="result" aria-live="polite"></output>
  <section>
    <div class="failed-header">
      <h2 class="failed-title">Link lỗi cần xử lý tay</h2>
      <button id="clearFailedLinks" class="secondary-button" type="button">Clear</button>
    </div>
    <div id="failedLinks" class="failed-list"></div>
  </section>
</main>
  <script src="popup.js"></script>
</body>
</html>
